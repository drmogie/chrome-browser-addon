name: Chrome Browser
version: "2026.10.04.06"
slug: chrome_browser
image: ghcr.io/drmogie/{arch}-addon-chrome-browser
description: A Chromium browser you use from a web page, running on your Home Assistant server
url: https://github.com/drmogie/chrome-browser-addon
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ports:
  5800/tcp: 3011
  5900/tcp: null
ports_description:
  5800/tcp: Browser web page. Host port 3011
  5900/tcp: VNC client port (optional, off by default)
webui: "[PROTO:ssl]://[HOST]:[PORT:5800]"
map:
  - addon_config:rw
panel_icon: mdi:google-chrome
options:
  timezone: "America/Los_Angeles"
  username: ""
  password: ""
  start_url: ""
  proxy_server: ""
  dns_server: ""
  dark_mode: false
  screen_width: 1920
  screen_height: 1080
  extra_chrome_flags: "--no-sandbox --disable-dev-shm-usage"
  ssl: true
schema:
  timezone: str
  username: str?
  password: password?
  start_url: str?
  proxy_server: str?
  dns_server: str?
  dark_mode: bool?
  screen_width: int(320,7680)?
  screen_height: int(240,4320)?
  extra_chrome_flags: str?
  ssl: bool?
